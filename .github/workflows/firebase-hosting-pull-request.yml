name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root dependencies (shared libs)
        run: npm ci
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: hosting_deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCIBOWL_ANALYTICS }}
          projectId: scibowl-analytics
