name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: hosting_deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCIBOWL_ANALYTICS }}
          projectId: scibowl-analytics
      - name: Comment preview URL on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const detailsUrl = core.getInput('detailsUrl');
            const urls = core.getInput('urls');
            const channelId = core.getInput('channelId');
            const parts = [];
            if (detailsUrl) parts.push(`Preview: ${detailsUrl}`);
            if (urls) parts.push(`URLs: ${urls}`);
            if (channelId) parts.push(`Channel: ${channelId}`);
            const body = parts.length ? parts.join('\n') : 'Firebase preview deployed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          result-encoding: string
          github-token: ${{ secrets.GITHUB_TOKEN }}
          detailsUrl: ${{ steps.hosting_deploy.outputs.details_url }}
          urls: ${{ steps.hosting_deploy.outputs.urls }}
          channelId: ${{ steps.hosting_deploy.outputs.channelId }}
