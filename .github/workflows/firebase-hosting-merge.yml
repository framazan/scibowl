name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: hosting_deploy
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCIBOWL_ANALYTICS }}
          channelId: live
          projectId: scibowl-analytics
      - name: Publish deploy summary
        run: |
          echo "✅ Firebase Hosting deploy completed." >> $GITHUB_STEP_SUMMARY
          echo "Live URL: ${{ steps.hosting_deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY
          echo "Channel: ${{ steps.hosting_deploy.outputs.channelId }}" >> $GITHUB_STEP_SUMMARY
